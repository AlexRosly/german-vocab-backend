services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocab
      POSTGRES_PASSWORD: vocab_dev_password
      POSTGRES_DB: german_vocab
    ports:
      - "5432:5432"
    volumes:
      - vocab_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocab -d german_vocab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vocab_pg_data:
